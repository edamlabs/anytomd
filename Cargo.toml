[workspace]
resolver = "3"
members = ["crates/native", "crates/oar"]

[workspace.package]
version = "1.5.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/edamlabs/anytomd"

[workspace.dependencies]
pyo3 = { version = "0.30.1", features = ["extension-module", "abi3-py312", "experimental-async"] }
anytomd = { version = "=1.3.1", default-features = false, features = ["async"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync"] }
### Default features fetch ONNX Runtime over native-tls (OpenSSL headers at build time, absent in manylinux): the
### same prebuilt download goes over rustls through `ort` below, pinned to the version oar-ocr requires.
oar-ocr = { version = "=0.11.0", default-features = false, features = ["simd"] }
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["download-binaries", "tls-rustls"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
