[package]
name = "anytomd-native"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Native binding of anytomd-rs for Python: documents to Markdown."

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { workspace = true }
anytomd = { workspace = true }
tokio = { workspace = true }

### ONNX Runtime ships no x86_64-apple-darwin binaries: Intel macOS builds without the Rust OCR and falls back to liteparse.
[target.'cfg(not(all(target_os = "macos", target_arch = "x86_64")))'.dependencies]
anytomd-oar = { path = "../oar" }
